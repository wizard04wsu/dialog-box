	<script type="module">
		import DialogBox from "./dist/dev_esm/dialog-box.mjs.js";
		DialogBox.registerTagName(/* here you can set the tag name to something other than the default */);
		document.getElementById('open').addEventListener('click', () => {
			document.querySelector('#dlg').showModal();
		});
		document.getElementById('open2').addEventListener('click', () => {
			document.querySelector('#dlg2').show();
		});
	</script>
	
	<style>
		body { font: 16px/1.4 system-ui, sans-serif; padding: 2rem; }
		button { padding: .5rem .9rem; border-radius: .5rem; border: 1px solid #0002; cursor: pointer; }
		dialog-box::part(dialog) { border: 3px solid #000; }
		dialog-box::part(backdrop) { background: #8004; }
	</style>
	
</head>
<body>
	
	<h1>🧪 <code>&lt;dialog-box&gt;</code> Custom Element Test</h1>
	
	<button id="open">Open modal dialog</button>
	<button id="open2">Open non-modal dialog</button>

	<dialog-box id="dlg">
		<button type="button" onclick="this.parentNode.close()">Close</button>
		<button type="button" style="background:rebeccapurple; color:white; border:0" onclick="alert('Action!')">Action</button>
	</dialog-box>
	
	<dialog-box id="dlg2">
		<button type="button" onclick="this.parentNode.close()">Close</button>
	</dialog-box>
	
</body>
</html>
